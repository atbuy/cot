name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string
      ref:
        description: "Git ref to build; defaults to the tag input"
        required: false
        type: string
      draft:
        description: "Create or update the release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.tag) || github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        # The font is for the tests that render annotation text.
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 gtk4-layer-shell ttf-dejavu

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Lint
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

  build:
    needs: verify
    runs-on: ubuntu-latest
    # GTK is linked dynamically, so each distribution release gets its own build.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm --needed base-devel git rustup gtk4 gtk4-layer-shell
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            install: >-
              apt-get update -q &&
              apt-get install -y -q build-essential git pkg-config ca-certificates curl rustup
              libgtk-4-dev libgtk4-layer-shell-dev

    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          COT_VERSION="$RELEASE_TAG" COT_COMMIT="$(git rev-parse HEAD)" cargo build --release --locked

      - name: Smoke test
        run: target/release/cot version | grep -F "$RELEASE_TAG"

      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/cot-${{ matrix.distro }}-x86_64.tar.gz" -C target/release cot

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cot-${{ matrix.distro }}-x86_64
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## Install

            ```sh
            curl -fsSL https://raw.githubusercontent.com/atbuy/cot/main/install.sh | sh -s -- --version ${{ env.RELEASE_TAG }}
            ```

            Already installed? Run `cot self update`.
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
